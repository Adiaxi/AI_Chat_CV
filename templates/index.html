<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asystent AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='Icon.jpg') }}">
</head>
<body>
    <div class="chat-container">
        <h3>CV Chat</h3>
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Zadaj pytanie o moje doświadczenie...">
            <button onclick="sendMsg()">Wyślij</button>
        </div>
    </div>

    <script>
    function aiMessage(id, content) {
        return `
            <div class="msg-wrapper" id="${id}">
                <img src="/static/Icon.jpg" class="avatar">
                <div class="msg ai">${content}</div>
            </div>
        `;
    }

    async function sendFeedback(pytanie, odpowiedz, typ, btn) {
        await fetch('/feedback', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({pytanie: pytanie, odpowiedz: odpowiedz, typ: typ})
        });
        btn.innerHTML = typ === 'like' ? "✅" : "❌";
        btn.disabled = true;
        const sibling = btn.nextElementSibling || btn.previousElementSibling;
        if (sibling) sibling.disabled = true;
    }

    async function sendMsg() {
        const input = document.getElementById('user-input');
        const box = document.getElementById('chat-box');

        if(!input.value.trim()) return;

        const userText = input.value;
        box.innerHTML += `<div class="msg user">${userText}</div>`;

        const typingId = "typing-" + Date.now();
        box.innerHTML += aiMessage(typingId, '<i>Adrian myśli...</i>');

        input.value = '';
        box.scrollTop = box.scrollHeight;

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({msg: userText})
            });
            const data = await response.json();

            const wrapper = document.getElementById(typingId);
            wrapper.querySelector('.msg.ai').innerHTML = `
                ${data.response}
                <br>
                <button class="feedback-btn" onclick="sendFeedback('${userText.replace(/'/g, "\\'")}', '${data.response.replace(/'/g, "\\'")}', 'like', this)">👍 Dobra</button>
                <button class="feedback-btn dislike" onclick="sendFeedback('${userText.replace(/'/g, "\\'")}', '${data.response.replace(/'/g, "\\'")}', 'dislike', this)">👎 Zła</button>
            `;
            box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
        } catch (error) {
            const wrapper = document.getElementById(typingId);
            wrapper.querySelector('.msg.ai').innerHTML = "Błąd połączenia.";
        }
    }

    document.getElementById('user-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMsg();
        }
    });

    window.addEventListener('load', function() {
        const box = document.getElementById('chat-box');
        box.innerHTML += aiMessage('welcome', 'Cześć! Jestem AI asystentem Adriana 👋 Zapytaj mnie o jego doświadczenie, umiejętności lub projekty!');
    });

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function() {
            const container = document.querySelector('.chat-container');
            container.style.height = (window.visualViewport.height * 0.85) + 'px';
            setTimeout(() => {
                document.getElementById('user-input').scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 100);
        });
    }
    </script>
</body>
</html>
